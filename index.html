<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — My Printer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <h1 class="login-title">My Printer</h1>
      <p class="login-subtitle">Staff sign-in to view and export application reports</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            placeholder="you@company.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit">
          Sign In
        </button>

        <p class="error-message" id="login-error" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initLoginPage);
  </script>
</body>
</html>
