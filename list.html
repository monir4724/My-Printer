<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applications — My Printer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar" aria-label="Main">
    <a class="navbar-brand" href="list.html">My Printer</a>
    <div class="navbar-actions">
      <button type="button" class="btn-logout" id="logout-btn">Logout</button>
    </div>
  </nav>

  <main class="list-main">
    <header class="list-header">
      <h1>Applications</h1>
      <p class="list-subtitle" id="list-count">Loading…</p>
    </header>

    <div class="error-banner" id="list-error" hidden role="alert">
      <span class="error-banner-icon" aria-hidden="true">!</span>
      <span class="error-banner-text" id="list-error-msg">Could not load applications.</span>
    </div>

    <div class="list-card" id="list-card">
      <p class="loading-text" id="list-loading">Loading applications…</p>
      <div class="table-wrap" id="list-table-wrap" hidden>
        <table class="apps-table" id="apps-table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Position</th>
              <th scope="col">Department</th>
              <th scope="col">Status</th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="apps-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/list.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initListPage);
  </script>
</body>
</html>
